name: Account deletion security

on:
  pull_request:
    paths:
      - ".github/workflows/account-deletion.yml"
      - "docs/account-deletion*.md"
      - "package.json"
      - "package-lock.json"
      - "scripts/check-account-deletion-static.mjs"
      - "scripts/resume-account-deletion-job.ts"
      - "scripts/*account-deletion*"
      - "src/integrations/supabase/auth-middleware.ts"
      - "src/integrations/supabase/client.server.ts"
      - "src/integrations/supabase/types.ts"
      - "src/lib/account-deletion*.ts"
      - "src/lib/account.functions.ts"
      - "src/routes/profile.tsx"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "tests/account-deletion*.ts"
  push:
    branches: [main]
    paths:
      - ".github/workflows/account-deletion.yml"
      - "docs/account-deletion*.md"
      - "package.json"
      - "package-lock.json"
      - "scripts/check-account-deletion-static.mjs"
      - "scripts/resume-account-deletion-job.ts"
      - "scripts/*account-deletion*"
      - "src/integrations/supabase/auth-middleware.ts"
      - "src/integrations/supabase/client.server.ts"
      - "src/integrations/supabase/types.ts"
      - "src/lib/account-deletion*.ts"
      - "src/lib/account.functions.ts"
      - "src/routes/profile.tsx"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "tests/account-deletion*.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: account-deletion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:account-deletion
      - run: >-
          npx eslint
          scripts/check-account-deletion-static.mjs
          scripts/resume-account-deletion-job.ts
          scripts/check-account-deletion-runtime.ts
          scripts/list-account-deletion-jobs.ts
          scripts/verify-account-deletion.ts
          scripts/account-deletion-*.ts
          scripts/verify-account-deletion-upgrade.mjs
          scripts/verify-account-deletion-ai-boundary.mjs
          tests/account-deletion*.ts
          src/integrations/supabase/auth-middleware.ts
          src/integrations/supabase/types.ts
          src/lib/account-deletion-errors.ts
          src/lib/account-deletion-admin.ts
          src/lib/account-deletion-workflow.ts
          src/lib/account-deletion.server.ts
          src/lib/account.functions.ts
          src/routes/profile.tsx
      - run: npm run build
        env:
          NITRO_PRESET: vercel
      - name: Verify service-role credentials are absent from browser assets
        run: |
          if grep -R -l -E "SUPABASE_SERVICE_ROLE_KEY|service_role|runAccountDeletionWorkflow|list_account_deletion_avatars|list_account_deletion_attention|claim_account_deletion_job" .vercel/output/static; then
            echo "A service-role marker was found in browser assets."
            exit 1
          fi

  supabase-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v2
        with:
          version: 2.110.0
          github-token: ${{ github.token }}
      - name: Start isolated Supabase
        run: supabase start
      - name: Rebuild all migrations from zero
        run: supabase db reset --local
      - name: Lint database functions and schema
        run: supabase db lint --local --level warning
      - name: Test SQL constraints, privacy, and account deletion
        run: supabase test db
      - name: Export isolated test variables
        run: |
          supabase status -o env \
            --override-name api.url=SUPABASE_URL \
            --override-name auth.anon_key=SUPABASE_PUBLISHABLE_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            > .env.security
      - name: Test resumable account deletion through Auth, Storage, RPC, and Supabase JS
        run: node --env-file=.env.security --experimental-strip-types scripts/verify-account-deletion.ts
      - name: Test current-schema deletion races and real Storage capabilities
        run: node --env-file=.env.security --experimental-strip-types --test tests/account-deletion-integration.test.ts
      - name: Build isolated Vercel handler for AI pending-account checks
        run: npm run build
        env:
          NITRO_PRESET: vercel
      - name: Test all AI handlers reject pending and deleted accounts before provider calls
        run: node --env-file=.env.security scripts/verify-account-deletion-ai-boundary.mjs
      - name: Test Stage 1 and Stage 2 static and unit regressions
        run: node --experimental-strip-types --test tests/marketplace-static.test.mjs tests/marketplace-errors.test.ts tests/collection-replacement-static.test.mjs tests/collection-replacement-errors.test.ts
      - name: Test Stage 1 and Stage 2 API and concurrency regressions
        run: node --env-file=.env.security --experimental-strip-types --test --test-concurrency=1 tests/marketplace-boundaries.test.mjs tests/collection-replacement.test.mjs
      - name: Test atomic deck creation regression
        run: node --env-file=.env.security scripts/verify-atomic-deck-creation.mjs
      - name: Test collection report validation regression
        run: node --env-file=.env.security scripts/verify-collection-report-validation.mjs
      - name: Test profile privacy regression
        run: node --env-file=.env.security scripts/run-profile-email-privacy-fixture.mjs
      - name: Test study integrity regression
        run: node --env-file=.env.security scripts/run-study-data-integrity-fixture.mjs
      - name: Test AI quota and RLS regression
        run: node --env-file=.env.security scripts/verify-ai-security-quotas.mjs
        env:
          AI_SECURITY_TEST_CONFIG_MUTATION: "true"
      - name: Rehearse Stage 2 to Stage 3 upgrade with preserved synthetic content
        run: node --env-file=.env.security scripts/verify-account-deletion-upgrade.mjs
        env:
          ACCOUNT_DELETION_RESET_LOCAL: "true"
      - name: Stop isolated Supabase
        if: always()
        run: supabase stop --no-backup
