<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Memora</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        font-family: -apple-system, system-ui, sans-serif; background: #ffffff; color: #1d1d1f;
        padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
        text-align: center;
      }
      @media (prefers-color-scheme: dark) { body { background: #000000; color: #f5f5f7; } }
      .logo { width: 64px; height: 64px; border-radius: 16px; background: #7132f5; color: #fff;
        display: grid; place-items: center; font-size: 30px; font-weight: 700; margin: 0 auto 20px; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { margin: 0 auto 24px; max-width: 300px; opacity: .7; line-height: 1.45; }
      button { font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 12px 28px;
        background: #7132f5; color: #fff; }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">M</div>
      <h1>You're offline</h1>
      <p>Memora needs an internet connection to sync your decks. Check your connection and try again.</p>
      <button type="button" onclick="window.location.replace('https://word-ace-deck.vercel.app/dashboard')">Try again</button>
    </main>
  </body>
</html>
